      </div>
    </div>

  <script>
    const tbody = document.getElementById('tabela-pracownikow');

    for (let i = 1; i <= 12; i++) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="center">${i}</td>
        <td>
          <input type="text" class="input-pracownik-naam" list="baza-pracownikow" placeholder="Nazwisko...">
        </td>
        <td>
          <input type="text" class="input-pracownik-functie" list="baza-functie" placeholder="Stanowisko...">
        </td>
        <td>
          <input type="number" class="num-input input-pracownik-uren" step="0.5" placeholder="0">
        </td>
      `;
      tbody.appendChild(tr);
    }

    flatpickr("#datum-input", {
      dateFormat: "d/m/Y",
      defaultDate: "today",
      disableMobile: "true"
    });

    const inputOmschrijving = document.getElementById('input-omschrijving');
    let dotychczasowyTekst = '';

    inputOmschrijving.addEventListener('focus', function() {
      dotychczasowyTekst = this.value;
      this.value = '';
    });

    inputOmschrijving.addEventListener('change', function() {
      const nowoWybranaOpcja = this.value.trim();

      if (nowoWybranaOpcja !== '') {
        if (dotychczasowyTekst !== '') {
          this.value = dotychczasowyTekst + ', ' + nowoWybranaOpcja;
        } else {
          this.value = nowoWybranaOpcja;
        }
      } else {
        this.value = dotychczasowyTekst;
      }
      
      dotychczasowyTekst = this.value;
    });

    inputOmschrijving.addEventListener('blur', function() {
      if (this.value === '' && dotychczasowyTekst !== '') {
        this.value = dotychczasowyTekst;
      }
    });

    // Funkcje do obsługi okienka modalnego
    function toonBevestigingModal() {
      document.getElementById('confirm-modal').style.display = 'flex';
    }

    function sluitModal() {
      document.getElementById('confirm-modal').style.display = 'none';
    }

    function bevestigEnVerzend() {
      sluitModal();
      generujJPGiWyslij();
    }

    function generujJPGiWyslij() {
      const btn = document.getElementById('btn-submit');
      btn.innerText = "Genereren en verzenden...";
      btn.disabled = true;

      const element = document.getElementById('bon-pracy');
      
      // Pobieramy wartość z pola Steigernummer
      const steigernummerInput = document.getElementById('input-steigernummer')?.value.trim();
      
      // Tworzymy bezpieczną nazwę pliku (zamienia znaki niedozwolone w nazwach plików na myślniki)
      const czystaNazwa = steigernummerInput ? steigernummerInput.replace(/[/\\?%*:|"<>]/g, '-') : 'Regiebon_Altrad';
      const nazwaPliku = czystaNazwa + '.jpg';

      html2canvas(element, {
        scale: 2,
        backgroundColor: "#ffffff"
      }).then(canvas => {
        const imageBase64 = canvas.toDataURL('image/jpeg', 0.85);

        // Pobieranie kopii lokalnej pod nową nazwą
        const link = document.createElement('a');
        link.download = nazwaPliku;
        link.href = imageBase64;
        link.click();

        // Wysłanie obrazu do EmailJS
        const templateParams = {
          content_jpg: imageBase64,
          opdrachtgever: document.getElementById('input-opdrachtgever')?.value || '-',
          steigernummer: steigernummerInput || '-'
        };

        emailjs.send('altrad', 'template_fk8w0nf', templateParams)
          .then(function(response) {
             alert('Het JPG-bestand (' + nazwaPliku + ') is gedownload en succesvol verzonden via e-mail!');
             btn.innerText = "JPG downloaden en e-mail verzenden";
             btn.disabled = false;
          }, function(error) {
             alert('Bestand gedownload, maar er is een fout opgetreden bij EmailJS: ' + JSON.stringify(error));
             btn.innerText = "JPG downloaden en e-mail verzenden";
             btn.disabled = false;
          });
      });
    }
  </script>
