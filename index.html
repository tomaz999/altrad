    .info-block {

    .field-group {

      align-items: center;

    .field-group:last-child {

    }

    .field-group label {

      font-weight: bold;
    }

    .field-group input[type="text"] {

      border: none;
      border-bottom: 1px dotted #666;
      padding: 2px 5px;
      font-size: 11px;
      outline: none;
    }

    /* Styl przełącznika (radio-toggle) */

      gap: 10px;
      align-items: center;
    }

    .radio-toggle label {
      width: auto;
      font-weight: normal;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .radio-toggle input[type="radio"] {
      cursor: pointer;
      margin: 0;
    }

    /* Kontener dla pola daty z ikoną kalendarza */
    .date-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
    }

    .date-wrapper input {
      width: 100%;
      background: transparent;
      cursor: pointer;

    .date-icon {

      cursor: pointer;
      pointer-events: none;
      font-size: 12px;

      border-bottom: none;
      padding: 4px 8px;

      font-size: 11px;

      border: none;
      outline: none;
      font-size: 11px;

      padding-bottom: 4px;
      margin-bottom: 8px;

  <script>
    // Generowanie 12 wierszy tabeli
    const tbody = document.getElementById('tabela-pracownikow');

    for (let i = 1; i <= 12; i++) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="center">${i}</td>
        <td>
          <input type="text" list="baza-pracownikow" placeholder="Nazwisko...">
        </td>
        <td>
          <input type="text" list="baza-functie" placeholder="Stanowisko...">
        </td>
        <td>
          <input type="number" class="num-input" step="0.5" placeholder="0">
        </td>
      `;
      tbody.appendChild(tr);
    }

    // Inicjalizacja interaktywnego kalendarza
    flatpickr("#datum-input", {
      dateFormat: "d/m/Y",
      defaultDate: "today",
      disableMobile: "true"
    });

    // Funkcja generująca JPG i wysyłająca e-mail przez EmailJS
    function generujJPGiWyslij() {
      const btn = document.getElementById('btn-submit');
      btn.innerText = "Generowanie i wysyłanie...";
      btn.disabled = true;

      const element = document.getElementById('bon-pracy');
      
      html2canvas(element, {
        scale: 2,
        backgroundColor: "#ffffff"
      }).then(canvas => {
        const imageBase64 = canvas.toDataURL('image/jpeg', 0.90);

        // 1. Pobierz plik JPG na komputer lokalny
        const link = document.createElement('a');
        link.download = 'Regiebon_Altrad.jpg';
        link.href = imageBase64;
        link.click();

        // 2. Wyślij e-mail z załącznikiem za pomocą EmailJS
        const templateParams = {
          my_file: imageBase64 
        };

        // PODMIEN 'TWOJ_SERVICE_ID' na identyfikator usługi z EmailJS
        emailjs.send('altrad', 'template_fk8w0nf', templateParams)
          .then(function(response) {
             alert('Plik pobrany i e-mail wysłany pomyślnie!');
             btn.innerText = "Pobierz JPG i wyślij E-mail";
             btn.disabled = false;
          }, function(error) {
             alert('Plik pobrany, ale wystąpił błąd przy wysyłaniu e-maila: ' + JSON.stringify(error));
             btn.innerText = "Pobierz JPG i wyślij E-mail";
             btn.disabled = false;
          });
      });
    }
  </script>
